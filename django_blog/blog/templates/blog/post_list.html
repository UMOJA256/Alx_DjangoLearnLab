{% extends "base.html" %}

{% block content %}
<h1>All Blog Posts</h1>

{% for post in posts %}
    <div class="post-card">
        <div class="post-title">{{ post.title }}</div>
        <div class="post-content">{{ post.content|truncatewords:30 }}</div>
        <a href="{% url 'post_detail' post.id %}">Read More</a>
    </div>
{% empty %}
    <p>No posts available.</p>
{% endfor %}

{% endblock %}
